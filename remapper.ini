; EXEと同じフォルダーに置く。編集後「INI再読込」。
[Device]
VendorId=06E7
ProductId=8099
ReportId=02

[Consumer]
; Usage ID（16進）=送信するキーボードキー
0030=X
006B=F1
0069=F2
006A=F3
006C=F4
0042=Up
0043=Down
0044=Left
0045=Right
0041=Enter
0224=Escape
0046=Escape
0040=P
; それ以外は元の入力のまま。ログで実際のUsageを確認可能。

[Keyboard]
; ONにすると通常のキーボードにも適用される
F5=D
F1=R
F2=S

[Repeat]
; Consumer長押し: 最初の待ち時間とリピート間隔（ミリ秒）
DelayMs=500
IntervalMs=30